name: Nanogas Playwright smoke tests

on:
  pull_request:
    branches: [main]
    paths: ["nanogas/**"]
  push:
    branches: [main]
    paths: ["nanogas/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanogas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nanogas/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium

      # A webServer config a playwright.config.ts-ben buildeli + kiszolgálja
      # a dist/-et, nincs szükség külön Vercel preview-URL-re ehhez a smoke
      # packhez.
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: nanogas/playwright-report/
          retention-days: 14
