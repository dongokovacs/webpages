name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bube-viragbolt/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install bube dependencies
        run: npm ci
        working-directory: bube-viragbolt

      - name: Build bube
        run: npm run build
        working-directory: bube-viragbolt

      - name: Install v0-ai-chat dependencies
        run: npm install
        working-directory: v0-ai-chat

      - name: Build v0-ai-chat
        run: npm run build
        working-directory: v0-ai-chat

      - name: Install steeldecor-story dependencies
        run: npm install
        working-directory: steeldecor-story

      - name: Build steeldecor-story
        run: npm run build
        working-directory: steeldecor-story

      - name: Build sophiegarden
        run: npm run build
        working-directory: sophiegarden

      - name: Install nanogas dependencies
        run: npm ci
        working-directory: nanogas

      - name: Install nanogas Python test dependencies
        run: pip install -r tests-py/requirements.txt
        working-directory: nanogas

      - name: Install Playwright chromium (for nanogas pytest suite)
        run: python -m playwright install --with-deps chromium
        working-directory: nanogas

      - name: Run nanogas pytest-playwright smoke suite
        # continue-on-error: egy piros nanogas teszt ne akassza meg a teljes
        # portfólió site deploy-ját — a riport pirosan mutatja majd a hibát.
        run: mkdir -p allure-results && python -m pytest --alluredir=allure-results
        working-directory: nanogas/tests-py
        continue-on-error: true

      - name: Install Allure commandline
        run: npm install --no-save allure-commandline
        working-directory: nanogas/tests-py

      - name: Generate Allure HTML report
        run: mkdir -p allure-report && npx allure generate allure-results --clean -o allure-report
        working-directory: nanogas/tests-py
        continue-on-error: true

      - name: Assemble site
        run: |
          mkdir -p _site/bube-viragbolt
          mkdir -p _site/v0-ai-chat
          mkdir -p _site/steeldecor-story
          mkdir -p _site/sophiegarden
          mkdir -p _site/nanogas-allure-report
          cp index.html projects.json robots.txt sitemap.xml _site/
          cp -r galiba Galiba2 serpa_sorfozde janoshalmi szamodra allatpatika templatesdemos eperdekor space _site/
          cp -r bube-viragbolt/dist/. _site/bube-viragbolt/
          cp -r v0-ai-chat/dist/. _site/v0-ai-chat/
          cp -r steeldecor-story/dist/. _site/steeldecor-story/
          cp -r sophiegarden/dist/. _site/sophiegarden/
          cp -r nanogas/tests-py/allure-report/. _site/nanogas-allure-report/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
