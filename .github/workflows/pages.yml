name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Csak az a projekt épül újra, amelyik mappájában változás történt.
# Minden buildelt projekt kimenete cache-be kerül, a kulcs a mappa tartalmának
# hash-e: ha a mappa nem változott, a kész build a cache-ből jön, és a
# telepítés/build lépések kimaradnak. A statikus mappák csak másolódnak.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- bube-viragbolt ----------
      - name: Cache bube build
        id: bube
        uses: actions/cache@v4
        with:
          path: bube-viragbolt/dist
          key: bube-${{ hashFiles('bube-viragbolt/**', '!bube-viragbolt/dist/**', '!bube-viragbolt/node_modules/**') }}

      - name: Build bube
        if: steps.bube.outputs.cache-hit != 'true'
        run: npm ci && npm run build
        working-directory: bube-viragbolt

      # ---------- v0-ai-chat ----------
      - name: Cache v0-ai-chat build
        id: v0
        uses: actions/cache@v4
        with:
          path: v0-ai-chat/dist
          key: v0-${{ hashFiles('v0-ai-chat/**', '!v0-ai-chat/dist/**', '!v0-ai-chat/node_modules/**') }}

      - name: Build v0-ai-chat
        if: steps.v0.outputs.cache-hit != 'true'
        run: npm install && npm run build
        working-directory: v0-ai-chat

      # ---------- steeldecor-story ----------
      - name: Cache steeldecor-story build
        id: steeldecor
        uses: actions/cache@v4
        with:
          path: steeldecor-story/dist
          key: steeldecor-${{ hashFiles('steeldecor-story/**', '!steeldecor-story/dist/**', '!steeldecor-story/node_modules/**') }}

      - name: Build steeldecor-story
        if: steps.steeldecor.outputs.cache-hit != 'true'
        run: npm install && npm run build
        working-directory: steeldecor-story

      # ---------- sophiegarden ----------
      - name: Cache sophiegarden build
        id: sophie
        uses: actions/cache@v4
        with:
          path: sophiegarden/dist
          key: sophie-${{ hashFiles('sophiegarden/**', '!sophiegarden/dist/**', '!sophiegarden/node_modules/**') }}

      - name: Build sophiegarden
        if: steps.sophie.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: sophiegarden

      # ---------- nanogas tesztriport (csak ha a nanogas változott) ----------
      - name: Cache nanogas Allure report
        id: nanogas
        uses: actions/cache@v4
        with:
          path: nanogas/tests-py/allure-report
          key: nanogas-report-${{ hashFiles('nanogas/**', '!nanogas/node_modules/**', '!nanogas/tests-py/allure-results/**', '!nanogas/tests-py/allure-report/**') }}

      - uses: actions/setup-python@v5
        if: steps.nanogas.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: steps.nanogas.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"

      # A nanogas tesztek egyik lépése sem akaszthatja meg a portfólió deploy-ját:
      # hiba esetén a riport pirosan/hiányosan jelenik meg, az oldal kimegy.
      - name: Run nanogas pytest-playwright smoke suite
        if: steps.nanogas.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: nanogas
        run: |
          npm ci
          pip install -r tests-py/requirements.txt
          python -m playwright install --with-deps chromium
          cd tests-py
          mkdir -p allure-results
          python -m pytest --alluredir=allure-results

      - name: Generate Allure HTML report
        if: steps.nanogas.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: nanogas/tests-py
        run: |
          mkdir -p allure-results allure-report
          npm install --no-save allure-commandline
          npx allure generate allure-results --clean -o allure-report

      # ---------- összerakás ----------
      - name: Assemble site
        run: |
          mkdir -p _site/bube-viragbolt _site/v0-ai-chat _site/steeldecor-story _site/sophiegarden _site/nanogas-allure-report _site/aquatech _site/vakolatbolt
          cp index.html projects.json robots.txt sitemap.xml _site/
          cp aquatech/*.html aquatech/favicon.svg _site/aquatech/
          cp -r aquatech/css aquatech/images aquatech/js _site/aquatech/
          cp -r galiba Galiba2 serpa_sorfozde janoshalmi szamodra allatpatika templatesdemos eperdekor space _site/
          cp -r bube-viragbolt/dist/. _site/bube-viragbolt/
          cp -r v0-ai-chat/dist/. _site/v0-ai-chat/
          cp -r steeldecor-story/dist/. _site/steeldecor-story/
          cp -r sophiegarden/dist/. _site/sophiegarden/
          cp -r nanogas/tests-py/allure-report/. _site/nanogas-allure-report/ || true
          cp -r beauty _site/beauty
          cp vakolatbolt/index.html _site/vakolatbolt/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
